  <script>if(!window.React||!window.ReactDOM||!window.Babel){document.body.insertAdjacentHTML('afterbegin','<p style="color:#fbbf24;font:18px sans-serif;padding:24px">Dashboard libraries missing — check 11-Visuals/vendor/ (react, react-dom, babel, tailwind).</p>');}</script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Bump SAVE_VERSION whenever the INIT_* constants below are updated at end of session.
    // The dashboard auto-saves to this browser; a refresh will NOT lose state mid-session.
    const SAVE_VERSION = 'S0-v9';
    function usePersist(key, init) {
      const k = 'se_' + SAVE_VERSION + '_' + key;
      const [v, setV] = useState(() => {
        try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : init; } catch (e) { return init; }
      });
      useEffect(() => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, [v]);
      return [v, setV];
    }

    // ─── Campaign Data ──────────────────────────────────────────────────────────
    // After each session, update the values below to reflect final session state.

    const INIT_CREW = { heat: 0, coin: 0, rep: 0, wanted: 0, tier: 0, xp: 0, hold: false };

    const INIT_PCS = [
      { id: 1, name: '[PC 1]', role: '—', stress: 0, harm: [0, 0, 0], trauma: 0, xp: 0, vice: '', purveyor: '', heirloom: '', pattern: '', stage: 0, friend: '', rival: '' },
      { id: 2, name: '[PC 2]', role: '—', stress: 0, harm: [0, 0, 0], trauma: 0, xp: 0, vice: '', purveyor: '', heirloom: '', pattern: '', stage: 0, friend: '', rival: '' },
      { id: 3, name: '[PC 3]', role: '—', stress: 0, harm: [0, 0, 0], trauma: 0, xp: 0, vice: '', purveyor: '', heirloom: '', pattern: '', stage: 0, friend: '', rival: '' },
    ];

    const INIT_CLOCKS = [
      { id: 'det',  name: 'Detection',             total: 4, cur: 0, fill: '#dc2626', secret: false },
      { id: 'surge',name: 'The Surge (S1 only)',   total: 6, cur: 0, fill: '#c2410c', secret: false },
      { id: 'bio',  name: 'Bio Spoilage',          total: 3, cur: 0, fill: '#ea580c', secret: false },
      { id: 'sub',  name: 'Subway Decay',          total: 6, cur: 0, fill: '#7f1d1d', secret: true  },
      { id: 'omen', name: 'The Omen',              total: 8, cur: 0, fill: '#7c3aed', secret: true  },
      { id: 'aud',  name: 'Ministry Audit (GM-secret until S4)', total: 4, cur: 0, fill: '#b45309', secret: true  },
      { id: 'subdue',name: 'Subdue (a fight only)', total: 6, cur: 0, fill: '#9a3412', secret: false },
      { id: 'cor',  name: "Innocent's Corruption", total: 4, cur: 0, fill: '#be185d', secret: true  },
    ];

    const INIT_NPCS = [
      { id: 1, name: 'Elias Thorne',   faction: 'Ministry', note: 'warm · earnest · too-invested', status: 1 },
      { id: 2, name: 'Director Vance', faction: 'Ministry', note: 'procedural · neutral',           status: 1 },
    ];

    const INIT_FACTIONS = [
      { id: 1, name: 'The Ministry', standing: 3 },
      { id: 2, name: 'Apex Aegis',   standing: 3 },
      { id: 3, name: 'Twice-Born',   standing: 3 },
      { id: 4, name: 'Subway',       standing: 3 },
    ];

    // Anchors the crew has touched. status index: 0 In Vault · 1 Active · 2 Seized · 3 Destroyed
    const INIT_ANCHORS = [];

    // GM-SECRET: the six Thorne tells (see 05-Sessions/Campaign-Arc.md). state: 0 unplanted · 1 planted · 2 caught by players
    const INIT_TELLS = [
      { id: 1, label: '1 · First name before intros (S1)', state: 0 },
      { id: 2, label: '2 · "Your setup in the basement" (S1)', state: 0 },
      { id: 3, label: '3 · Pause outside Emmerich’s (S2)', state: 0 },
      { id: 4, label: '4 · "Dropping by my office last Tuesday" (S2)', state: 0 },
      { id: 5, label: '5 · Knows about the pier / Subway (S3)', state: 0 },
      { id: 6, label: '6 · The ring, right hand (ongoing)', state: 0 },
    ];
    const TELL_LABELS = ['—', 'Planted', 'CAUGHT'];
    const TELL_CLS = [
      'border-zinc-800 text-zinc-500 bg-zinc-900',
      'border-amber-700 text-amber-400 bg-amber-950/20',
      'border-emerald-700 text-emerald-400 bg-emerald-950/20',

    // Mechanics the players have been taught (the players have NEVER played Blades — see 00-Canon/Mechanics-Teaching-Ladder.md).

    const INIT_TAUGHT = [
      { id: 'dice',  label: 'Dice & the 6 / 4–5 / 1–3 rule  (S0)',  state: 0 },
      { id: 'pos',   label: 'Position  (S0)',                         state: 0 },
      { id: 'eff',   label: 'Effect  (S0)',                           state: 0 },
      { id: 'str',   label: 'Stress  (S0)',                           state: 0 },
      { id: 'res',   label: 'Resistance  (S0 practice → S1)',                       state: 0 },
      { id: 'fb',    label: 'Flashback  (S1)',                        state: 0 },
      { id: 'devil', label: "Devil's Bargain  (S1)",                  state: 0 },
      { id: 'vice',  label: 'Heat → Entanglement → Vice  (S1)',         state: 0 },
      { id: 'group', label: 'Group Action  (S2)',                     state: 0 },
      { id: 'assist',label: 'Assist  (S2)',                           state: 0 },
      { id: 'favor', label: 'Twice-Born Favor  (S2)',                 state: 0 },
      { id: 'ent',   label: 'Entanglements  (S1; reinforce S2–S3)',  state: 0 },
      { id: 'acq',   label: 'Acquire Assets  (S3)',                   state: 0 },
      { id: 'push',  label: 'Push Yourself  (S1/S3)',                 state: 0 },
      { id: 'load',  label: 'Load (the standard kit)  (S1)',          state: 0 },
      { id: 'clocks',label: 'Clocks (what they are)  (S1)',           state: 0 },
      { id: 'xptally',label: 'XP tally (S1 close)',                   state: 0 },
      { id: 'despxp',label: 'XP: Desperate + end tally  (S1)',        state: 0 },
      { id: 'harm',  label: 'Harm levels  (when it happens)',         state: 0 },
    ];
    const TAUGHT_LABELS = ['—', 'Introduced', 'Understood'];
    const TAUGHT_CLS = [
      'border-zinc-800 text-zinc-500 bg-zinc-900',
      'border-amber-700 text-amber-400 bg-amber-950/20',
      'border-emerald-700 text-emerald-400 bg-emerald-950/20',
    ];

    // Running gags & table-invented canon. counters/notes the GM bumps live.
    const INIT_GAGS = [
      { id: 'cons', label: 'Consequence was on…',          note: '' },
      { id: 'cov',  label: 'Cover stories invented',       note: '' },
      { id: 'greta',label: 'Greta’s highest form no.',     note: '' },
      { id: 'ptol', label: 'PTOLEMY’s charges so far',     note: '' },
      { id: 'zol',  label: 'Zoltar cards dropped',         note: '' },
      { id: 'gerald', label: 'Gerald status',              note: '' },
      { id: 'nick',  label: 'PC nicknames',                 note: '' },
      { id: 'city',  label: 'City canon (avoided district…)', note: '' },
      { id: 'rules', label: 'Wall of Rules claims',         note: '' },
      { id: 'trophy',label: 'Trophy Wall (+1d Study types)', note: '' },
      { id: 'crewdef',label: 'Crew: reputation / ability / upgrade', note: '' },
      { id: 'coin',  label: 'Zoltar coin code',             note: '' },
      { id: 'lease', label: 'Lease theories',               note: '' },
      { id: 'stalls',label: 'Stalls: investment opportunities (target 4+)', note: '' },
    ];

    // ─── Lookup Tables ──────────────────────────────────────────────────────────

    const HARM_LABELS = ['None', 'L1', 'L2', 'L3'];
    const HARM_CLS = [
      'border-zinc-700 text-zinc-500 bg-zinc-900',
      'border-yellow-700 text-yellow-400 bg-yellow-950/30',
      'border-orange-600 text-orange-400 bg-orange-950/30',
      'border-red-600 text-red-400 bg-red-950/30',
    ];

    const STATUS_LABELS = ['Loyal', 'Neutral', 'Wary', 'Hostile', 'Compromised', 'Missing'];
    const STATUS_CLS = [
      'border-emerald-700 text-emerald-400 bg-emerald-950/20',
      'border-zinc-700 text-zinc-400 bg-zinc-800',
      'border-amber-700 text-amber-400 bg-amber-950/20',
      'border-red-700 text-red-400 bg-red-950/20',
      'border-orange-700 text-orange-400 bg-orange-950/20',
      'border-zinc-800 text-zinc-500 bg-zinc-950',
    ];

    const STAND_LABELS = ['−3', '−2', '−1', 'Neutral', '+1', '+2', '+3'];
    const STAND_CLS = [
      'border-red-900 text-red-300 bg-red-950/50',
      'border-red-800 text-red-400 bg-red-950/30',
      'border-orange-800 text-orange-400 bg-orange-950/20',
      'border-zinc-700 text-zinc-400 bg-zinc-800',
      'border-amber-700 text-amber-400 bg-amber-950/20',
      'border-emerald-700 text-emerald-400 bg-emerald-950/20',
      'border-emerald-500 text-emerald-300 bg-emerald-950/40',
    ];

    const ANCHOR_STATUSES = ['In Vault', 'Active', 'Seized', 'Destroyed', 'Returned', 'Refused'];
    const ANCHOR_CLS = [
      'text-amber-400 border-amber-800',
      'text-emerald-400 border-emerald-800',
      'text-orange-400 border-orange-800',
      'text-red-400 border-red-800',
      'text-sky-400 border-sky-800',
      'text-zinc-400 border-zinc-700',
    ];

    // ─── Clock Component ────────────────────────────────────────────────────────

    function Clock({ c, onSet, hot, veilCls }) {
      const [hovered, setHovered] = useState(null);
      const r = 43, cx = 50, cy = 50;
      const segs = Array.from({ length: c.total }, (_, i) => {
        const a0 = ((i / c.total) * 360 - 90) * (Math.PI / 180);
        const a1 = (((i + 1) / c.total) * 360 - 90) * (Math.PI / 180);
        const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
        const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
        const large = 1 / c.total > 0.5 ? 1 : 0;
        const filled = i < c.cur;
        const segFill = filled ? c.fill : hovered === i ? '#52525b' : '#18181b';
        return (
          <path
            key={i}
            d={`M${cx},${cy}L${x0},${y0}A${r},${r} 0 ${large},1 ${x1},${y1}Z`}
            fill={segFill}
            stroke="#52525b"
            strokeWidth="2"
            style={{ cursor: 'pointer', transition: 'fill 0.15s' }}
            onClick={() => onSet(c.id, filled ? i : i + 1)}
            onMouseEnter={() => setHovered(i)}
            onMouseLeave={() => setHovered(null)}
          />
        );
      });

      return (
        <div className={`flex flex-col items-center bg-zinc-900/60 border rounded-xl p-2.5 transition-all ${
          hot ? 'ring-2 ring-amber-400 bg-amber-950/30 ' : ''}${
          c.cur === c.total ? 'border-red-500 bg-red-950/20' :
          (c.cur > 0 && c.cur >= c.total - 1) ? 'border-amber-500 bg-amber-950/15' :
          c.cur === 0 ? 'border-zinc-800/70 opacity-60 hover:opacity-100' : 'border-zinc-600'
        } ${c.secret ? veilCls : ''}`}>
          {c.secret && (
            <span className="text-[11px] font-mono text-purple-500 uppercase tracking-widest mb-1">
              ⬡ SECRET
            </span>
          )}
          <svg viewBox="0 0 100 100" className="w-12 h-12">
            <circle cx={cx} cy={cy} r={r + 2} fill="none" stroke="#3f3f46" strokeWidth="1" />
            {segs}
            <circle cx={cx} cy={cy} r="17" fill="#09090b" />
            <text
              x={cx} y={cy + 6}
              textAnchor="middle"
              fontSize="18"
              fontFamily="monospace"
              fontWeight="bold"
              fill={c.cur === c.total ? c.fill : '#a1a1aa'}
            >
              {c.cur}
            </text>
          </svg>
          <p className={`text-[12px] font-bold uppercase tracking-wide text-center mt-2 leading-tight ${c.secret ? 'text-purple-400' : 'text-zinc-500'}`}>
            {c.name}
          </p>
          <p className="text-[11px] font-mono text-zinc-500 mt-0.5">{c.cur}/{c.total}</p>
          <div className="flex gap-1 mt-1">
            <button onClick={() => onSet(c.id, c.cur - 1)} className="w-8 h-7 rounded bg-zinc-800/70 hover:bg-zinc-700 text-zinc-300 text-sm font-bold leading-none">−</button>
            <button onClick={() => onSet(c.id, c.cur + 1)} className="w-8 h-7 rounded bg-zinc-800/70 hover:bg-zinc-700 text-zinc-300 text-sm font-bold leading-none">+</button>
          </div>
        </div>
      );
    }

    // ─── Main Dashboard ─────────────────────────────────────────────────────────

    function ShadowExchangeDashboard() {
      const [crew, setCrew]           = usePersist('crew', INIT_CREW);
      const [pcs, setPcs]             = usePersist('pcs', INIT_PCS);
      const [clocks, setClocks]       = usePersist('clocks', INIT_CLOCKS);
      const [npcs, setNpcs]           = usePersist('npcs', INIT_NPCS);
      const [factions, setFactions]   = usePersist('factions', INIT_FACTIONS);
      const [anchors, setAnchors]     = usePersist('anchors', INIT_ANCHORS);
      const [graveyard, setGraveyard] = usePersist('graveyard', []);
      const [tells, setTells]         = usePersist('tells', INIT_TELLS);
      const [gags, setGags]           = usePersist('gags', INIT_GAGS);
      const [taught, setTaught]       = usePersist('taught', INIT_TAUGHT);
      const cycleTaught = (id) => setTaught(p => p.map(t => t.id === id ? { ...t, state: (t.state + 1) % 3 } : t));
      const cycleTell = (id) => setTells(p => p.map(t => t.id === id ? { ...t, state: (t.state + 1) % 3 } : t));
      const setGagNote = (id, note) => setGags(p => p.map(g => g.id === id ? { ...g, note } : g));
      const resetAll = () => { if (confirm('Reset the dashboard to the saved INIT state (ignoring ops already in the feed)?')) {
        const maxSeq = ((window.DASH_FEED && window.DASH_FEED.ops) || []).reduce((m, o) => Math.max(m, o.seq || 0), 0);
        try {
          Object.keys(localStorage).filter(k => k.startsWith('se_')).forEach(k => localStorage.removeItem(k));
          localStorage.setItem('se_' + SAVE_VERSION + '_feedseq', String(maxSeq));
        } catch (e) {}
        location.reload(); } };
      const [veil, setVeil] = usePersist('veil', false);
      const [flash, setFlash] = useState({});
      const [tv, setTv] = useState(null);
      useEffect(() => {
        const poll = () => {
          const sc = document.createElement('script');
          sc.src = 'player-screen/scene.js?t=' + Date.now();
          sc.onload = () => { try { const s = window.SCENE; if (s) setTv({ image: s.image, caption: s.caption, card: s.card, crew: s.crew, clocks: s.clocks }); } catch (e) {} sc.remove(); };
          sc.onerror = () => sc.remove();
          document.head.appendChild(sc);
        };
        poll(); const id = setInterval(poll, 2500); return () => clearInterval(id);
      }, []);
      const veilCls = veil ? 'blur-[6px] hover:blur-none transition-all select-none' : '';
      useEffect(() => {
        const onKey = (e) => {
          const tag = (document.activeElement && document.activeElement.tagName) || '';
          if ((e.key === 'p' || e.key === 'P') && tag !== 'INPUT' && tag !== 'TEXTAREA') setVeil(v => !v);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      const [newAnchor, setNewAnchor] = useState('');
      const [newNpc, setNewNpc]       = useState('');

      // ── Live feed from the Co-GM (dashboard-feed/feed.js) ─────────────────────
      const [feedLog, setFeedLog] = usePersist('feedlog', []);
      const [scene, setScene] = usePersist('scene', { beat: '—', title: 'Waiting for the session to start', next: '' });
      const describe = (o) => o.note || ({
        scene: `Now: ${o.beat !== undefined ? o.beat : ''} ${o.title !== undefined ? o.title : ''}${o.next ? ' → next ' + o.next : ''}`,
        stress: `PC ${o.pc} Stress → ${o.value}`,
        harm: `PC ${o.pc} Harm slot ${o.slot + 1} → ${HARM_LABELS[o.value]}`,
        clock: `Clock ${o.id} → ${o.value !== undefined ? o.value : '+' + o.delta}`,
        crew: `${o.key} → ${o.value !== undefined ? o.value : '+' + o.delta}`,
        taught: `Taught ${o.id}: ${TAUGHT_LABELS[o.state]}`,
        tell: `Tell ${o.id}: ${TELL_LABELS[o.state]}`,
        pc: `PC ${o.pc}: ${o.name || ''}`,
        pcinfo: `PC ${o.pc} details updated`,
        faction: `Faction ${o.id} → ${STAND_LABELS[o.standing]}`,
        npc_add: `New NPC: ${o.name}`,
        anchor_add: `Anchor: ${o.name}`,
        anchor_status: `${o.name} → ${ANCHOR_STATUSES[o.status]}`,
        gag: `Note: ${o.label || o.id}`
      }[o.op] || o.op);
      const applyOp = (o) => {
        const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
        switch (o.op) {
          case 'crew':    setCrew(p => ({ ...p, [o.key]: Math.max(0, o.delta !== undefined ? (p[o.key] || 0) + o.delta : o.value) })); break;
          case 'clock':   setClocks(p => p.map(c => c.id === o.id ? { ...c, cur: clamp(o.delta !== undefined ? c.cur + o.delta : o.value, 0, c.total) } : c)); break;
          case 'stress':  setPcs(p => p.map(pc => pc.id === o.pc ? { ...pc, stress: clamp(o.value, 0, 9) } : pc)); break;
          case 'harm':    setPcs(p => p.map(pc => pc.id === o.pc ? { ...pc, harm: pc.harm.map((h, i) => i === o.slot ? clamp(o.value, 0, 3) : h) } : pc)); break;
          case 'pc':      setPcs(p => p.map(pc => pc.id === o.pc ? { ...pc, ...(o.name !== undefined ? { name: o.name } : {}), ...(o.role !== undefined ? { role: o.role } : {}) } : pc)); break;
          case 'tell':    setTells(p => p.map(t => t.id === o.id ? { ...t, state: clamp(o.state, 0, 2) } : t)); break;
          case 'taught':  setTaught(p => p.map(t => t.id === o.id ? { ...t, state: clamp(o.state, 0, 2) } : t)); break;
          case 'gag':     setGags(p => p.some(g => g.id === o.id) ? p.map(g => g.id === o.id ? { ...g, note: (document.activeElement && document.activeElement.dataset && document.activeElement.dataset.gag === o.id) ? g.note : o.note } : g) : [...p, { id: o.id, label: o.label || o.id, note: o.note || '' }]); break;
          case 'faction': setFactions(p => p.map(f => f.id === o.id ? { ...f, standing: clamp(o.standing, 0, 6) } : f)); break;
          case 'anchor_add':    setAnchors(p => [...p, { id: Date.now() + Math.random(), name: o.name, status: o.status || 0 }]); break;
          case 'anchor_status': setAnchors(p => p.map(a => a.name === o.name ? { ...a, status: o.status } : a)); break;
          case 'npc_add': setNpcs(p => [...p, { id: Date.now() + Math.random(), name: o.name, faction: o.faction || '—', note: o.note || '', status: o.status === undefined ? 1 : o.status }]); break;
          case 'pcinfo':  setPcs(p => p.map(pc => pc.id === o.pc ? { ...pc, ...Object.fromEntries(Object.entries(o).filter(([k]) => ['vice','purveyor','heirloom','pattern','stage','friend','rival','trauma','xp'].includes(k))) } : pc)); break;
          case 'scene':   setScene(p => ({ ...p, ...(o.beat !== undefined ? { beat: o.beat } : {}), ...(o.title !== undefined ? { title: o.title } : {}), ...(o.next !== undefined ? { next: o.next } : {}) })); break;
          default: break;
        }
      };
      useEffect(() => {
        const seqKey = 'se_' + SAVE_VERSION + '_feedseq';
        const poll = () => {
          const sc = document.createElement('script');
          sc.src = 'dashboard-feed/feed.js?t=' + Date.now();
          sc.onload = () => {
            try {
              const ops = (window.DASH_FEED && window.DASH_FEED.ops) || [];
              let last = 0; try { last = parseInt(localStorage.getItem(seqKey) || '0', 10); } catch (e) {}
              const maxSeq = ops.reduce((m, o) => Math.max(m, o.seq || 0), 0);
              if (maxSeq < last) { last = 0; try { localStorage.setItem(seqKey, '0'); } catch (e) {} }   // feed.js was reset
              const fresh = ops.filter(o => o.seq > last).sort((a, b) => a.seq - b.seq);
              if (fresh.length) {
                fresh.forEach(applyOp);
                try { localStorage.setItem(seqKey, String(fresh[fresh.length - 1].seq)); } catch (e) {}
                const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const touched = {};
                fresh.forEach(o => {
                  if (o.op === 'crew') touched['crew:' + o.key] = 1;
                  else if (o.op === 'clock') touched['clock:' + o.id] = 1;
                  else if (['stress', 'harm', 'pc', 'pcinfo'].includes(o.op)) touched['pc:' + o.pc] = 1;
                  else if (o.op === 'tell') touched['tell:' + o.id] = 1;
                  else if (o.op === 'taught') touched['taught:' + o.id] = 1;
                  else if (o.op === 'gag') touched['gag:' + o.id] = 1;
                  else if (o.op === 'faction') touched['faction:' + o.id] = 1;
                });
                setFlash(touched); setTimeout(() => setFlash({}), 3500);
                const entries = [...fresh].reverse().map(o => ({
                  t, secret: o.op === 'tell' || o.id === 'omen' || o.pattern !== undefined || o.stage !== undefined,
                  text: describe(o)
                }));
                setFeedLog(p => [...entries, ...p].slice(0, 60));
              }
            } catch (e) {}
            sc.remove();
          };
          sc.onerror = () => sc.remove();
          document.head.appendChild(sc);
        };
        poll(); const id = setInterval(poll, 2000); return () => clearInterval(id);
      }, []);

      const [copied, setCopied] = useState(false);
      const copySnapshot = () => {
        const snap = {
          crew,
          pcs: pcs.map(p => ({ id: p.id, name: p.name, role: p.role, stress: p.stress, harm: p.harm, trauma: p.trauma, xp: p.xp, vice: p.vice, heirloom: p.heirloom, pattern: p.pattern, stage: p.stage, friend: p.friend, rival: p.rival })),
          clocks: clocks.map(c => c.name + ': ' + c.cur + '/' + c.total),
          factions: factions.map(f => f.name + ': ' + STAND_LABELS[f.standing]),
          anchors: anchors.map(a => a.name + ' (' + ANCHOR_STATUSES[a.status] + ')'),

</section>
            <section>
              <h2 className="text-[12px] font-black uppercase tracking-[0.2em] text-zinc-500 mb-2">Mechanics Taught · max 4 / session</h2>
              <div className="bg-zinc-900/30 border border-zinc-800 rounded-xl p-3 space-y-1.5">
                {taught.map(t => (
                  <div key={t.id} className={`flex items-center justify-between gap-2 rounded px-1 ${flash['taught:' + t.id] ? 'ring-2 ring-amber-400 bg-amber-950/30' : ''}`}>
                    <span className="text-[14px] text-zinc-400 flex-1">{t.label}</span>
                    <button onClick={() => cycleTaught(t.id)}
                      className={`text-[12px] font-mono font-bold px-2 py-0.5 rounded border transition-all ${TAUGHT_CLS[t.state]}`}>
                      {TAUGHT_LABELS[t.state]}
                    </button>
                  </div>
                ))}
              </div>
            </section>
            </div>

            {/* ── GRAVEYARD ── */}
            {graveyard.length > 0 && (
              <section>
                <h2 className="text-[12px] font-black uppercase tracking-[0.2em] text-zinc-500 mb-3">Graveyard</h2>
                <div className="space-y-1.5 opacity-50">
                  {graveyard.map((g, i) => (
                    <div key={i} className="flex justify-between items-center px-3 py-1.5 bg-zinc-950 border border-zinc-900 rounded-lg">
                      <span className="text-[13px] text-zinc-500">{g.name}</span>
                      <span className="text-[11px] font-mono text-zinc-500">{g.type} · {g.fate}</span>
                    </div>
                  ))}
                </div>
              </section>
            )}

          </div>

          <footer className="max-w-[1760px] mx-auto mt-10 pt-4 border-t border-zinc-900 text-center">
            <p className="text-[11px] font-mono text-zinc-600 uppercase tracking-widest">
              Cover Status: Nominal · Resonance Field: Contained · <span style={{animation: 'pulse 2s infinite'}}>Recording...</span>
            </p>
            <div className="mt-2 flex items-center justify-center gap-4">
              <button onClick={copySnapshot} className="text-[12px] font-mono px-3 py-1 rounded border border-zinc-700 text-zinc-300 hover:border-amber-600 hover:text-amber-400">{copied ? '✓ Copied — paste it to the Co-GM' : 'Copy end-of-session snapshot'}</button>
              <button onClick={resetAll} className="text-[11px] font-mono text-zinc-600 hover:text-zinc-400 uppercase tracking-widest">reset saved state</button>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ShadowExchangeDashboard />);
  </script>
</body>
</html>
